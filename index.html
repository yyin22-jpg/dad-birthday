<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dad's Birthday Tickets</title>
<meta name="description" content="Happy Birthday Dad! Redeem your birthday tickets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: a black instrument panel. Chrome headline over a dot-matrix field, a status readout, then a dense wrapping grid of small glass tickets. Single dark look on purpose. */
:root {
  color-scheme: dark;
  --void: #05060a;
  --panel: #0d0f15;
  --line: rgba(220, 230, 255, .14);
  --line-hi: rgba(220, 230, 255, .55);
  --text: #e9edf7;
  --dim: #7d8496;
  --glow: #cfe0ff;
  --font-display: "Orbitron", "Eurostile", "Arial Black", system-ui, sans-serif;
  --font-mono: "Space Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body { min-height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--void);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
}
#bg, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#bg { z-index: 0; }
#fx { z-index: 50; }
body::after { /* vignette */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse at 50% 30%, transparent 40%, rgba(0, 0, 0, .75) 100%);
}

.wrap {
  position: relative; z-index: 2;
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: clamp(40px, 8vw, 88px) 110px;
  display: flex; flex-direction: column; gap: clamp(32px, 6vw, 56px);
}

/* ---------- Banner ---------- */
.banner { display: flex; flex-direction: column; gap: clamp(14px, 2.4vw, 22px); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 900; line-height: .92; text-transform: uppercase; }
h1 span { display: block; }
.l1 {
  font-size: clamp(26px, 6.4vw, 72px); font-weight: 700; letter-spacing: .08em;
  color: transparent; -webkit-text-stroke: 1px var(--line-hi);
  animation: rise 1s cubic-bezier(.2, .8, .2, 1) both;
}
.l2 {
  font-size: clamp(76px, 21vw, 230px); letter-spacing: .02em;
  background: linear-gradient(180deg, #ffffff 0%, #c9cfdc 38%, #5b6273 52%, #e8ecf5 64%, #8d94a6 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 24px rgba(207, 224, 255, .18));
  position: relative;
  animation: rise 1.1s .12s cubic-bezier(.2, .8, .2, 1) both;
}
.l2::after { /* sheen sweep */
  content: attr(data-text); position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 40%, rgba(255, 255, 255, .85) 50%, transparent 60%) -150% 0 / 200% 100% no-repeat;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: sheen 6s 1.4s ease-in-out infinite;
}
@keyframes rise { from { opacity: 0; transform: translateY(24px); letter-spacing: .3em; } to { opacity: 1; transform: none; } }
@keyframes sheen { 0% { background-position: -150% 0; } 35%, 100% { background-position: 250% 0; } }

.readout {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  border-top: 1px solid var(--line); padding-top: 16px;
  font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim);
}
.readout .n { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 3.4vw, 30px); letter-spacing: .06em; color: var(--text); font-variant-numeric: tabular-nums; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 10px var(--glow); animation: blink 2s infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* ---------- Tickets ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.ticket {
  position: relative; display: grid; grid-template-columns: 1fr 26px;
  height: 72px; border: 0; padding: 0; cursor: pointer; text-align: left;
  font: inherit; color: var(--text);
  background: linear-gradient(140deg, #1a1e28 0%, #0c0e14 55%, #141822 100%);
  box-shadow: inset 0 0 0 1px var(--line);
  border-radius: 6px;
  -webkit-mask:
    radial-gradient(circle 7px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle 7px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
          mask:
    radial-gradient(circle 7px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle 7px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
  transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s, background .25s;
  animation: boot .5s cubic-bezier(.2, .8, .2, 1) both;
  overflow: hidden;
}
.ticket::before { /* glass sheen */
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .09) 45%, transparent 60%) -120% 0 / 220% 100% no-repeat;
  transition: background-position .7s;
}
.ticket:hover, .ticket:focus-visible { transform: translateY(-3px); box-shadow: inset 0 0 0 1px var(--line-hi), 0 0 18px rgba(207, 224, 255, .12); outline: none; }
.ticket:hover::before, .ticket:focus-visible::before { background-position: 120% 0; }
.ticket:focus-visible { box-shadow: inset 0 0 0 2px var(--glow); }
@keyframes boot { from { opacity: 0; transform: scale(.9); filter: brightness(3); } to { opacity: 1; transform: none; filter: none; } }

.main { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 6px 0 16px; min-width: 0; }
.tag { font-size: 9px; letter-spacing: .28em; color: var(--dim); text-transform: uppercase; }
.num { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.stub { border-left: 1px dashed var(--line-hi); display: grid; place-items: center; }
.stub i { width: 6px; height: 6px; border: 1px solid var(--line-hi); transform: rotate(45deg); }

.ticket.armed { background: var(--text); color: var(--void); box-shadow: 0 0 26px rgba(207, 224, 255, .45); }
.ticket.armed .tag { color: var(--void); }
.ticket.armed .stub { border-color: rgba(5, 6, 10, .4); }
.ticket.armed .stub i { border-color: var(--void); background: var(--void); }

.ticket.out { pointer-events: none; animation: derez .6s steps(6) forwards; }
@keyframes derez {
  0% { clip-path: inset(0 0 0 0); filter: brightness(2); }
  50% { clip-path: inset(40% 0 35% 0); transform: scaleX(1.08); }
  100% { clip-path: inset(50% 50% 50% 50%); opacity: 0; }
}

.empty {
  grid-column: 1 / -1; border: 1px dashed var(--line); border-radius: 8px;
  padding: 40px 24px; text-align: center; color: var(--dim);
  display: flex; flex-direction: column; gap: 6px; align-items: center;
  font-size: 13px; letter-spacing: .08em;
}
.empty strong { font-family: var(--font-display); color: var(--text); font-size: 15px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; }

/* ---------- Add button & dialog ---------- */
.add {
  position: fixed; z-index: 40;
  right: calc(22px + env(safe-area-inset-right, 0px));
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  width: 60px; height: 60px; border: 0; padding: 0; cursor: pointer; border-radius: 50%;
  background: var(--panel); color: var(--text);
  box-shadow: inset 0 0 0 1px var(--line-hi), 0 0 24px rgba(207, 224, 255, .15);
  display: grid; place-items: center; transition: box-shadow .3s, transform .3s;
}
.add::before { /* orbit ring */
  content: ""; position: absolute; inset: -7px; border-radius: 50%;
  border: 1px dashed var(--line-hi); animation: spin 14s linear infinite;
}
.add:hover, .add:focus-visible { outline: none; transform: scale(1.06); box-shadow: inset 0 0 0 1px var(--glow), 0 0 34px rgba(207, 224, 255, .35); }
.add svg { width: 22px; height: 22px; }
@keyframes spin { to { transform: rotate(360deg); } }

dialog {
  border: 0; padding: 0; color: var(--text);
  background: linear-gradient(160deg, #141822, #07080c);
  width: min(380px, calc(100vw - 32px)); border-radius: 14px;
  box-shadow: inset 0 0 0 1px var(--line-hi), 0 30px 90px rgba(0, 0, 0, .7);
}
dialog::backdrop { background: rgba(2, 3, 6, .75); backdrop-filter: blur(6px); }
form.panel { padding: 26px; display: flex; flex-direction: column; gap: 22px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-size: 16px; letter-spacing: .22em; text-transform: uppercase; font-weight: 700; }
.panel .sub { margin: -12px 0 0; color: var(--dim); font-size: 13px; }
.stepper { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
.stepper button {
  width: 44px; height: 44px; border: 0; border-radius: 7px; cursor: pointer;
  background: rgba(220, 230, 255, .06); color: var(--text); font: 700 20px var(--font-mono);
}
.stepper button:hover { background: rgba(220, 230, 255, .14); }
.stepper output { font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 10px; justify-content: flex-end; }
.btn { font: 700 12px var(--font-mono); letter-spacing: .18em; text-transform: uppercase; border: 0; border-radius: 8px; padding: 13px 18px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--dim); }
.btn.primary { background: var(--text); color: var(--void); }
.btn.primary:hover { box-shadow: 0 0 20px rgba(207, 224, 255, .4); }
.btn:focus-visible, .stepper button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.btn[disabled] { opacity: .5; cursor: default; }
.err { color: #ff8a8a; font-size: 13px; margin: 0; }

.toast {
  position: fixed; z-index: 60; left: 50%; bottom: calc(30px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 16px); opacity: 0; transition: .3s;
  background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-hi);
  font-size: 12px; letter-spacing: .18em; text-transform: uppercase; padding: 11px 18px; border-radius: 8px;
  max-width: calc(100vw - 130px); text-align: center;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

.code { display: flex; flex-direction: column; gap: 8px; }
.code label { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }
.code input { font: 700 20px var(--font-mono); letter-spacing: .3em; color: var(--text); background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; outline: none; }
.code input:focus { border-color: var(--glow); }
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="wrap">
  <header class="banner">
    <h1 aria-label="Happy Birthday Dad!">
      <span class="l1" aria-hidden="true">Happy Birthday</span>
      <span class="l2" data-text="Dad!" aria-hidden="true">Dad!</span>
    </h1>
    <div class="readout" aria-live="polite">
      <span class="pulse" aria-hidden="true"></span>
      <span class="n" id="count">--</span>
      <span id="countLabel">Loading tickets</span>
    </div>
  </header>

  <section class="grid" id="grid" aria-label="Tickets">
    <div class="empty" id="empty">
      <strong>Loading</strong>
      <span>Tickets will appear here in a moment.</span>
    </div>
  </section>
</main>

<button class="add" id="addBtn" type="button" aria-label="Add tickets" title="Add tickets">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><path d="M12 4v16M4 12h16"/></svg>
</button>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form class="panel" id="addForm" method="dialog">
    <h2 id="dlgTitle">Issue tickets</h2>
    <p class="sub">Choose how many new tickets to add.</p>
    <div class="code" id="codeField" hidden>
      <label for="codeInput">Passcode</label>
      <input type="password" id="codeInput" inputmode="numeric" autocomplete="off">
    </div>
    <div class="stepper" role="group" aria-label="Number of tickets">
      <button type="button" id="qtyDown" aria-label="Fewer">−</button>
      <output id="qty">01</output>
      <button type="button" id="qtyUp" aria-label="More">+</button>
    </div>
    <p class="err" id="formErr" hidden></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn primary" id="printBtn">Add 1 ticket</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script type="module">
/* =====================================================================
   SETTINGS — fill these in (see README.md)
   ===================================================================== */

// Paste the config object from Firebase: Project settings → Your apps → Web app.
// Leave it as-is to run in demo mode (tickets saved only in this browser).
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDSwql2VIueSFdNpJNUxw2gwHPc8bKGsRg",
  authDomain: "meow-d10cc.firebaseapp.com",
  databaseURL: "https://meow-d10cc-default-rtdb.firebaseio.com",
  projectId: "meow-d10cc",
  storageBucket: "meow-d10cc.firebasestorage.app",
  messagingSenderId: "686718743393",
  appId: "1:686718743393:web:6e2dee3fd5e023d52fcb20"
};

// Code needed before the + button will add tickets. Change it to your own.
// This only keeps casual visitors out; it is not real security.
const ADD_PASSCODE = "meow";

/* ===================================================================== */

const FIREBASE_VERSION = "10.12.2";
const $ = (id) => document.getElementById(id);
const grid = $("grid"), empty = $("empty");
const els = new Map();
const leaving = new Set();
let docs = [];
let store = null;
const pad = (n, w = 3) => String(n || 0).padStart(w, "0");
const safe = (fn, fallback) => { try { return fn(); } catch { return fallback; } };

/* ---------- background: dot matrix that lights up near the pointer ---------- */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const bg = $("bg"), b = bg.getContext("2d");
const fx = $("fx"), f = fx.getContext("2d");
let W = 0, H = 0;
const RADIUS = 190;
const target = { x: -9999, y: -9999 }, glow = { x: -9999, y: -9999 };
let glowAmt = 0, glowTarget = 0, bgQueued = false;
function size() {
  const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  for (const c of [bg, fx]) { c.width = W * dpr; c.height = H * dpr; c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0); }
}
function drawBg() {
  bgQueued = false;
  const k = reduce ? 1 : .18;
  if (glow.x < -9000) { glow.x = target.x; glow.y = target.y; }
  glow.x += (target.x - glow.x) * k; glow.y += (target.y - glow.y) * k;
  glowAmt += (glowTarget - glowAmt) * (reduce ? 1 : .08);
  b.clearRect(0, 0, W, H);
  const gap = 26;
  for (let y = gap / 2; y < H; y += gap) {
    for (let x = gap / 2; x < W; x += gap) {
      const d = Math.hypot(x - glow.x, y - glow.y);
      const boost = d < RADIUS ? Math.pow(1 - d / RADIUS, 2) * glowAmt : 0;
      b.fillStyle = `rgba(207,224,255,${.07 + boost * .85})`;
      const s = 1.4 + boost * 1.6;
      b.fillRect(x - s / 2, y - s / 2, s, s);
    }
  }
  const moving = Math.abs(target.x - glow.x) > .5 || Math.abs(target.y - glow.y) > .5 || Math.abs(glowTarget - glowAmt) > .01;
  if (moving) queueBg();
}
function queueBg() { if (!bgQueued) { bgQueued = true; requestAnimationFrame(drawBg); } }
addEventListener("pointermove", (e) => { target.x = e.clientX; target.y = e.clientY; glowTarget = 1; queueBg(); }, { passive: true });
addEventListener("pointerdown", (e) => { target.x = e.clientX; target.y = e.clientY; glowTarget = 1; queueBg(); }, { passive: true });
document.addEventListener("pointerleave", () => { glowTarget = 0; queueBg(); });
addEventListener("blur", () => { glowTarget = 0; queueBg(); });
size(); drawBg(); addEventListener("resize", () => { size(); drawBg(); });

/* ---------- particles ---------- */
let bits = [], running = false;
function burst(x, y, n = 40) {
  if (reduce) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 6;
    bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, len: 4 + Math.random() * 14, life: 1 });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  f.clearRect(0, 0, W, H);
  bits = bits.filter((p) => p.life > 0);
  f.lineWidth = 1.2; f.lineCap = "round";
  for (const p of bits) {
    p.x += p.vx; p.y += p.vy; p.vx *= .95; p.vy *= .95; p.life -= .02;
    const m = Math.hypot(p.vx, p.vy) || 1;
    f.strokeStyle = `rgba(230,238,255,${Math.max(0, p.life)})`;
    f.beginPath(); f.moveTo(p.x, p.y); f.lineTo(p.x - p.vx / m * p.len * p.life, p.y - p.vy / m * p.len * p.life); f.stroke();
  }
  if (bits.length) requestAnimationFrame(tick); else { running = false; f.clearRect(0, 0, W, H); }
}

let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2400); }

/* ---------- render ---------- */
function setStatus(n, label) { $("count").textContent = n; $("countLabel").textContent = label; }
function showEmpty(title, body) {
  empty.innerHTML = ""; const s = document.createElement("strong"); s.textContent = title;
  empty.append(s);
  if (body) { const p = document.createElement("span"); p.textContent = body; empty.append(p); }
  empty.hidden = false;
}
function makeTicket() {
  const el = document.createElement("button");
  el.type = "button"; el.className = "ticket";
  el.innerHTML = '<span class="main"></span><span class="stub"><i></i></span>';
  el.addEventListener("click", () => onTicket(el));
  el.addEventListener("blur", () => disarm(el));
  return el;
}
function render() {
  const seen = new Set(); let prev = null;
  for (const d of docs) {
    seen.add(d.id);
    let el = els.get(d.id);
    if (!el) { el = makeTicket(); els.set(d.id, el); }
    el.dataset.id = d.id;
    el.setAttribute("aria-label", "Ticket " + (d.serial || "") + ". Press twice to redeem.");
    const ref = prev ? prev.nextSibling : grid.firstChild;
    if (el !== ref) grid.insertBefore(el, ref);
    prev = el;
  }
  for (const [id, el] of els) if (!seen.has(id)) { el.remove(); els.delete(id); leaving.delete(id); }
  const n = docs.filter((d) => !leaving.has(d.id)).length;
  if (n === 0) showEmpty("No tickets currently"); else empty.hidden = true;
  grid.append(empty);
  setStatus(pad(n, 2), (n === 1 ? "Ticket remaining" : "Tickets remaining") + (store && store.demo ? " · demo mode" : ""));
}

/* ---------- redeem ---------- */
function disarm(el) { if (!el.classList.contains("armed")) return; el.classList.remove("armed"); clearTimeout(el._t); }
async function onTicket(el) {
  if (!store) { toast("Still connecting…"); return; }
  if (!el.classList.contains("armed")) {
    for (const o of els.values()) if (o !== el) disarm(o);
    el.classList.add("armed");
    clearTimeout(el._t); el._t = setTimeout(() => disarm(el), 3500);
    return;
  }
  const id = el.dataset.id;
  clearTimeout(el._t); el.classList.remove("armed");
  const r = el.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 46);
  el.classList.add("out"); leaving.add(id); render();
  try { await store.remove(id); toast("Ticket redeemed"); }
  catch { leaving.delete(id); el.classList.remove("out"); render(); toast("Couldn't redeem. Try again"); }
}

/* ---------- add dialog ---------- */
const UNLOCK_KEY = "dad-tickets-unlocked";
const isUnlocked = () => safe(() => localStorage.getItem(UNLOCK_KEY) === ADD_PASSCODE, false);
const dlg = $("dlg"); let qty = 1;
function setQty(n) { qty = Math.max(1, Math.min(20, n)); $("qty").textContent = pad(qty, 2); $("printBtn").textContent = "Add " + qty + (qty === 1 ? " ticket" : " tickets"); }
$("qtyDown").onclick = () => setQty(qty - 1);
$("qtyUp").onclick = () => setQty(qty + 1);
$("cancelBtn").onclick = () => dlg.close();
$("addBtn").onclick = () => {
  setQty(1); $("formErr").hidden = true;
  const locked = !isUnlocked();
  $("codeField").hidden = !locked; $("codeInput").value = "";
  dlg.showModal();
  (locked ? $("codeInput") : $("qtyUp")).focus();
};
$("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = $("formErr");
  if (!isUnlocked()) {
    if ($("codeInput").value.trim() !== ADD_PASSCODE) { err.textContent = "That code isn't right."; err.hidden = false; $("codeInput").select(); return; }
    safe(() => localStorage.setItem(UNLOCK_KEY, ADD_PASSCODE));
  }
  if (!store) { err.textContent = "Still connecting. Try again in a moment."; err.hidden = false; return; }
  const btn = $("printBtn"); btn.disabled = true;
  let serial = docs.reduce((m, d) => Math.max(m, d.serial || 0), 0);
  const base = Date.now();
  try {
    for (let i = 0; i < qty; i++) { serial++; await store.add({ serial, createdAt: base + i }); }
    dlg.close(); toast(qty === 1 ? "Ticket added" : qty + " tickets added");
    burst(W - 52, H - 52, 30);
  } catch {
    err.textContent = "Couldn't add tickets. Check your connection and try again."; err.hidden = false;
  } finally { btn.disabled = false; }
});

/* ---------- storage ---------- */
function localStore() {
  const KEY = "dad-tickets-demo";
  const read = () => safe(() => JSON.parse(localStorage.getItem(KEY)) || [], []);
  const write = (list) => safe(() => localStorage.setItem(KEY, JSON.stringify(list)));
  let listener = () => {};
  const emit = () => listener(read().sort((a, b) => a.createdAt - b.createdAt));
  return {
    demo: true,
    subscribe(fn) { listener = fn; emit(); addEventListener("storage", (e) => { if (e.key === KEY) emit(); }); },
    async add(t) { const list = read(); list.push({ id: "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ...t }); write(list); emit(); },
    async remove(id) { write(read().filter((t) => t.id !== id)); emit(); }
  };
}
async function firebaseStore(config) {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [{ initializeApp }, rtdb] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-database.js")]);
  const app = initializeApp(config);
  const db = rtdb.getDatabase(app);
  const list = rtdb.ref(db, "tickets");
  return {
    demo: false,
    subscribe(fn, onError) {
      rtdb.onValue(list, (snap) => {
        const out = [];
        snap.forEach((c) => { out.push({ id: c.key, ...c.val() }); });
        out.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        fn(out);
      }, onError);
    },
    add: (t) => rtdb.push(list, t),
    remove: (id) => rtdb.remove(rtdb.ref(db, "tickets/" + id))
  };
}

async function start() {
  const configured = FIREBASE_CONFIG.databaseURL && !FIREBASE_CONFIG.databaseURL.includes("your-project") && !String(FIREBASE_CONFIG.apiKey).startsWith("PASTE");
  let s;
  if (configured) {
    const timer = setTimeout(() => setStatus("--", "Can't reach tickets yet. Check your connection"), 10000);
    try { s = await firebaseStore(FIREBASE_CONFIG); }
    catch { clearTimeout(timer); setStatus("--", "Couldn't connect to the ticket database"); showEmpty("Can't load tickets", "Check the Firebase settings in index.html."); return; }
    s.subscribe((list) => { clearTimeout(timer); store = s; docs = list; render(); },
      () => { clearTimeout(timer); setStatus("--", "Ticket database refused access"); showEmpty("Can't load tickets", "Check the database rules in Firebase."); });
  } else {
    s = localStore(); store = s;
    s.subscribe((list) => { docs = list; render(); });
    toast("Demo mode: tickets are saved only in this browser");
  }
}
start();
</script>
